name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: npm ci
      - run: node scripts/release-manifest.mjs --check --tag
      - run: npm test
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build signed installer
        run: |
          node scripts/collect-licenses.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Could not collect dependency notices' }
          npm run package -- --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Prepare and verify update artifacts
        run: |
          node scripts/release-manifest.mjs
          cargo run --locked --no-default-features --example verify-update -- .local/release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $existing = gh release view $env:GITHUB_REF_NAME --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isDraft)) { throw 'This version is already published' }
          } else {
            gh release create $env:GITHUB_REF_NAME --verify-tag --draft --title "袅来运转桌面版 $env:GITHUB_REF_NAME" --notes-file "docs/releases/$env:GITHUB_REF_NAME.md"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release draft' }
          }
          gh release upload $env:GITHUB_REF_NAME .local/release/* --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the release artifacts' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release' }
      - name: Verify public updater endpoint
        run: cargo run --locked --example check-updater
